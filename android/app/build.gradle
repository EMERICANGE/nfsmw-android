plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nfsmw.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nfsmw.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++23 -fno-exceptions -fno-rtti'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    ndkVersion '28.2.13676358'
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
